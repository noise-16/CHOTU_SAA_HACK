<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearQueue - Scoring Engine Unit Tests</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 30px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    h1 {
      margin-top: 0;
      color: #0284c7;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .test-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .passed {
      border-left: 4px solid #16a34a;
    }
    .failed {
      border-left: 4px solid #dc2626;
    }
    .badge {
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    .badge-pass {
      background: #dcfce7;
      color: #15803d;
    }
    .badge-fail {
      background: #fee2e2;
      color: #b91c1c;
    }
    .summary {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #e2e8f0;
      font-weight: 700;
      font-size: 1.1rem;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ ClearQueue Test Runner</h1>
    <p style="color:#64748b;">Automated validation of deterministic General OPD prioritisation rubric.</p>
    <div id="results">Running tests...</div>
    <div id="summary" class="summary"></div>
  </div>

  <script type="module">
    import { runAllTests } from './scoring.test.js';

    const results = runAllTests();
    const container = document.getElementById('results');
    const summary = document.getElementById('summary');
    container.innerHTML = '';

    let passedCount = 0;

    results.forEach(res => {
      if (res.passed) passedCount++;
      const div = document.createElement('div');
      div.className = `test-item ${res.passed ? 'passed' : 'failed'}`;
      div.innerHTML = `
        <div>
          <div style="font-weight:600">${res.name}</div>
          <div style="font-size:0.85rem;color:#64748b;margin-top:2px;">${res.details}</div>
        </div>
        <span class="badge ${res.passed ? 'badge-pass' : 'badge-fail'}">${res.passed ? 'PASSED' : 'FAILED'}</span>
      `;
      container.appendChild(div);
    });

    summary.innerHTML = `Tests completed: ${passedCount}/${results.length} Passed (${passedCount === results.length ? '100% Succeeded ✅' : 'Some Failed ❌'})`;
  </script>
</body>
</html>
